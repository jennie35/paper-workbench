name: Backend and static checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: workbench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_CONCURRENCY_URL: postgresql+psycopg://workbench:test-only-password@localhost:5432/workbench_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - run: node --test frontend/tests/*.test.mjs
