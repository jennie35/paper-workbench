<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">分析者绘制，非论文原图 · 合成演示</title><desc id="desc">仅表示已完成的演示资料构建步骤，不是论文研究流程或未来实验。</desc><rect width="960" height="210" rx="18" fill="#f3f5f2"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#20312e"><text x="480" y="38" font-size="20">分析者绘制，非论文原图 · 合成演示</text><text x="480" y="65" font-size="14">以下为演示构建步骤；没有实施科研实验</text><g font-size="18"><rect x="30" y="100" width="250" height="60" rx="12" fill="#e5eee7"/><text x="155" y="137">撰写合成资料</text><text x="315" y="137">→</text><rect x="355" y="100" width="250" height="60" rx="12" fill="#e5eee7"/><text x="480" y="137">登记部分／候选状态</text><text x="640" y="137">→</text><rect x="680" y="100" width="250" height="60" rx="12" fill="#e5eee7"/><text x="805" y="137">构建离线看板</text></g><text x="480" y="192" font-size="13">此图不是原论文证据，也不表示已核验论文图表。</text></g></svg>